name: Publish to PyPI

# Bump, tag and publish all live in one run: a tag pushed with GITHUB_TOKEN
# does not start another workflow, so `on: push: tags` would never fire for
# a bump CI made itself. The filename is also the PyPI trusted publisher's
# identity -- renaming this file breaks publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cz.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Bump version
        id: cz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          uvx --from commitizen cz bump --yes
          status=$?
          set -e
          # 21 is NoneIncrementExit: nothing since the last tag warrants a
          # release. Any other non-zero is a real failure.
          if [ $status -eq 21 ]; then
            echo "no version bump needed"
            exit 0
          elif [ $status -ne 0 ]; then
            exit $status
          fi
          git push --follow-tags origin HEAD:main
          version=$(uvx --from commitizen cz version --project)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    if: needs.bump.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.bump.outputs.version }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
