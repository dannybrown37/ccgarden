[project]
name = "ccgarden"
version = "0.2.0"
description = "Grow a tree/garden visualization from ccstats.db session history"
authors = [
    { name = "Danny Brown", email = "dannybrown37@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude", "claude-code", "visualization", "svg", "stats"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/dannybrown37/ccgarden"
Repository = "https://github.com/dannybrown37/ccgarden"
Issues = "https://github.com/dannybrown37/ccgarden/issues"

[project.scripts]
ccgarden = "ccgarden:main"
ccstats = "ccgarden.claude_stats:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true
# `version` above is the single source of truth -- publish.yml builds from the
# tag `cz bump` writes, so nothing else may carry a copy of the number.
version_provider = "pep621"

[tool.ruff]
line-length = 79
show-fixes = true
target-version = "py312"

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "C4", "COM", "C90",
  "D200", "D201", "D202", "D205", "D212",
  "E", "EM", "ERA", "EXE", "F", "FBT", "G", "I", "ICN", "ISC", "N",
  "PGH", "PIE", "PL", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q",
  "RET", "RSE", "RUF", "S", "SLF", "SIM", "TCH", "TID", "TRY", "W",
  "UP", "YTT",
]
ignore = [
    "S311",
    "S101",
    "I001",
    "S113",
    "PLR0913",
    "PLC0415",
    "COM812",  # conflicts with formatter
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "PLR2004", "ANN001", "ANN003", "ARG002", "PT019"]
# Every query here splices in DayRange.clause(), which is one of three
# literal strings -- the day bounds themselves are always bound via `?`.
"src/ccgarden/data.py" = ["S608"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
